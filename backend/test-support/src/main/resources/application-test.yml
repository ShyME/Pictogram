# Defaults for every @ModuleIntegrationTest / @SpringBootTest run on the "test" profile.
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  datasource:
    hikari:
      maximum-pool-size: 4

# The orphan-media sweep runs only when a test asks it to, never on the cron.
pictogram:
  media:
    retention:
      collection-cron: "-"

# Plain-text logs under test; the app enables ECS JSON on other profiles.
logging:
  structured:
    format:
      console: ""
