# Defaults for every @ModuleIntegrationTest / @SpringBootTest run on the "test" profile.
spring:
  # spring-boot-starter-kafka is on the test classpath for the SharedKafka container the
  # notifications module needs (ADR-0015). Every slice must otherwise start with no broker,
  # so the client autoconfig, Modulith's Kafka externaliser and the notifications consumer
  # are all off here. Tests that do need Kafka re-include what they use explicitly
  # (SocialEventKafkaRelayTest; NotificationsModuleIntegrationTest).
  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
      - org.springframework.modulith.events.kafka.KafkaEventExternalizerConfiguration
      - me.imshy.pictogram.notifications.internal.NotificationsKafkaConsumerAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  datasource:
    hikari:
      maximum-pool-size: 4

# The orphan-media sweep runs only when a test asks it to, never on the cron.
pictogram:
  media:
    retention:
      collection-cron: "-"

# Plain-text logs under test; the app enables ECS JSON on other profiles.
logging:
  structured:
    format:
      console: ""
