# Production: run as a container. Datasource comes from the environment.
server:
  # Always reached through Caddy (ADR-0012, ADR-0014, #169) — honour its X-Forwarded-*
  # so redirect URIs and the OAuth2 callback are built with the external scheme and
  # host, not app's internal http://…:8080. `native` (Tomcat's RemoteIpValve) only
  # trusts the headers from an internal-proxy source, unlike `framework`, which trusts
  # any caller — `app` publishes no port, so the only client is Caddy on the compose
  # network.
  forward-headers-strategy: native

spring:
  datasource:
    url: ${PICTOGRAM_DB_URL}
    username: ${PICTOGRAM_DB_USERNAME}
    password: ${PICTOGRAM_DB_PASSWORD}

# The OpenAPI document is generated at build time and committed; production has no reason to
# serve it, and the /v3/api-docs endpoint sits on the permit-all filter chain.
springdoc:
  api-docs:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      # Full sampling (application.yml) is for local/dev; a deployed instance samples a fraction.
      probability: 0.1
