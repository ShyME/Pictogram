# Production: run as a container. Datasource comes from the environment.
spring:
  datasource:
    url: ${PICTOGRAM_DB_URL}
    username: ${PICTOGRAM_DB_USERNAME}
    password: ${PICTOGRAM_DB_PASSWORD}

# The OpenAPI document is generated at build time and committed; production has no reason to
# serve it, and the /v3/api-docs endpoint sits on the permit-all filter chain.
springdoc:
  api-docs:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
