# Local development on the host. Infra (PostgreSQL etc.) is started from compose.dev.yaml
# at the repo root — bootRun and the "Pictogram App (local)" run config both set the
# working directory there.
spring:
  docker:
    compose:
      enabled: true
      file: compose.dev.yaml
      lifecycle-management: start-only   # leave containers up between restarts
  datasource:
    url: jdbc:postgresql://localhost:5432/pictogram
    username: pictogram
    password: pictogram
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: pictogram-local
            client-secret: pictogram-local-secret
            scope: openid, email
        provider:
          # The mock-oauth2-server from compose.dev.yaml stands in for Google. Bring infra
          # up first (`docker compose -f compose.dev.yaml up -d`) — issuer discovery runs at
          # startup.
          google:
            issuer-uri: http://localhost:8090/default

pictogram:
  auth:
    cookie-secure: false   # local runs on plain http

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
