spring:
  application:
    name: pictogram
  jackson:
    time-zone: UTC   # Jackson 3 already serializes temporal types as ISO-8601 by default
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  docker:
    compose:
      enabled: false   # only the "local" profile starts infra via Compose
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

  # Kafka carries one externalised flow — social's PostLiked / PostCommented / UserFollowed
  # into the notifications context, ADR-0015. Nothing is @Externalized or consumed yet
  # (tickets #196 / #197); this is the connection wiring only.
  kafka:
    bootstrap-servers: ${PICTOGRAM_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notifications
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "me.imshy.pictogram.*"
    producer:
      # The outbox relay is the only producer — durable, in-order.
      acks: all
  modulith:
    events:
      # The JPA event-publication registry is the outbox (ADR-0015): resubmit anything that
      # did not reach the broker before the last shutdown.
      republish-outstanding-events-on-restart: true

# Google sign-in is off until a client is configured — set
# spring.security.oauth2.client.registration.google.client-id / .client-secret (env:
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID / ..._CLIENT_SECRET).
# Until then /oauth2/** is denied and the rest of the app runs normally. The "local"
# profile wires the bundled mock-oauth2-server.

# Pictogram-issued tokens (ADR-0004). signing-key is a private EC (P-256) JWK as JSON;
# when unset an ephemeral key is generated at startup — set it in production.
pictogram:
  auth:
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # A refresh token presented again within this window of being consumed is a benign
    # concurrent refresh (401, cookie cleared, no revoke) — outside it, token theft (#26).
    refresh-token-rotation-grace: 60s
    signing-key: ${PICTOGRAM_AUTH_SIGNING_KEY:}
    post-login-redirect: /
    # Where the browser lands when Google sign-in can't complete (#27). The ?error= reason
    # is generic here; identity swaps in email-unverified / email-missing for an unusable
    # Google account so the SPA can show a tailored message.
    sign-in-error-redirect: /login?error=sign-in-failed
  # Object storage for image bytes (ADR-0006). Defaults target a local MinIO (compose.dev.yaml);
  # prod overrides the endpoint and credentials from the environment. S3BlobStore creates the
  # bucket on first upload — a dev convenience only; a real deployment pre-creates it during
  # provisioning and withholds s3:CreateBucket from the runtime role (ADR-0011 / SEC-8).
  media:
    storage:
      endpoint: ${PICTOGRAM_MEDIA_ENDPOINT:http://localhost:9000}
      region: ${PICTOGRAM_MEDIA_REGION:us-east-1}
      access-key: ${PICTOGRAM_MEDIA_ACCESS_KEY:pictogram}
      secret-key: ${PICTOGRAM_MEDIA_SECRET_KEY:pictogram}
      bucket: ${PICTOGRAM_MEDIA_BUCKET:pictogram-media}
      path-style-access: ${PICTOGRAM_MEDIA_PATH_STYLE:true}
    # A background sweep deletes media no post references — never-posted uploads and the
    # images of deleted posts alike (#16). collection-cron is its schedule ("-" disables it);
    # the eligibility delay is pictogram.media.retention.grace-period (default 24h), the
    # window a composer mid-caption has before its upload can be swept.
    retention:
      collection-cron: ${PICTOGRAM_MEDIA_RETENTION_CRON:0 0 * * * *}

# The OpenAPI document is exported to backend/openapi.json (the `generateOpenApiSpec` Gradle
# task) and the frontend generates its typed client from that file. Swagger UI is not on the
# classpath — the JSON at /v3/api-docs is the whole surface, and it's disabled in production.
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  api-docs:
    version: openapi_3_1

server:
  shutdown: graceful
  port: 8080

# Structured (ECS) JSON logging to the console. Overridden to plain text on the "test"
# profile so test output stays readable.
logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState, db
  observations:
    annotations:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

# Module-boundary spans come from the spring-modulith-observability dependency — no config needed.
