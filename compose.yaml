# The whole app in containers: `docker compose up --build` -> http://localhost:8080
#
# This base file has no OIDC provider, so Google sign-in is denied. Add one overlay:
#   compose.mock-oauth.yaml  — a bundled mock, zero setup       (`task up`)
#   compose.google.yaml      — real Google, creds from .env     (`task up:google`)
# For host-based development (apps on the host, infra in containers) use compose.dev.yaml.
name: pictogram

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pictogram}
      POSTGRES_USER: ${POSTGRES_USER:-pictogram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pictogram}
    volumes:
      # Postgres 18 moved PGDATA to /var/lib/postgresql/18/docker and the image VOLUME up to
      # /var/lib/postgresql — mounting the old /data path leaves the cluster off the volume.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pictogram} -d ${POSTGRES_DB:-pictogram}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pictogram}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pictogram}
    volumes:
      - miniodata:/data

  # The apache/kafka-native image runs as uid 1000 but does not pre-create its data dir, so a
  # fresh named volume mounts root-owned and the broker can't write it. This one-shot fixes
  # the ownership before kafka starts. Same image tag as `kafka` below (and compose.dev.yaml;
  # tests use the JVM image, pinned in SharedKafka.java) — keep the four in sync.
  kafka-init:
    image: &kafka-image apache/kafka-native:4.2.1
    user: "0:0"
    entrypoint: ["sh", "-c", "mkdir -p /var/lib/kafka/data && chown -R 1000:1000 /var/lib/kafka/data"]
    volumes:
      - kafkadata:/var/lib/kafka/data

  # Single-node KRaft broker for the one externalised flow (ADR-0015). The GraalVM native
  # image keeps the footprint down — the box is 4 GB and already runs two JVMs, Postgres and
  # MinIO (ADR-0012), so the heap is capped here and this is a known memory-pressure point
  # tied to the #176 migration off the temporary host.
  kafka:
    image: *kafka-image
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # One node, so every replication factor is 1; 3 partitions per ADR-0015.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # The native launch script forwards KAFKA_OPTS to the binary but ignores KAFKA_HEAP_OPTS
      # (that is the JVM image's server-start script). This is the real heap cap for the box.
      KAFKA_OPTS: -Xmx512m -Xms256m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      # bash is in the image; the native image ships no JRE, so the kafka CLI scripts are out.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/9092' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Internal only — reached through the `caddy` entrypoint (ADR-0014, #169).
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # The prod profile refuses to start without a signing key (ADR-0004). This fixed key keeps
      # the bundled `task up` / blackbox stack runnable with no setup; a real deployment sets its
      # own PICTOGRAM_AUTH_SIGNING_KEY and never inherits this default.
      PICTOGRAM_AUTH_SIGNING_KEY: ${PICTOGRAM_AUTH_SIGNING_KEY:-{"kty":"EC","crv":"P-256","kid":"pictogram-compose-dev","x":"7EWxh26yV1MJB79bw4ltkPt9iBmiewFFvBwG-DDMOTE","y":"jfek6RiC-fb6vxojc9T4n-QdAjwhHYoMychxZ3gSa5g","d":"VDg-3hgXB7qy--cpjpDHTZv9ymMNY9aAuiLFg1pX2Og"}}
      PICTOGRAM_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pictogram}
      PICTOGRAM_DB_USERNAME: ${POSTGRES_USER:-pictogram}
      PICTOGRAM_DB_PASSWORD: ${POSTGRES_PASSWORD:-pictogram}
      PICTOGRAM_MEDIA_ENDPOINT: http://minio:9000
      PICTOGRAM_MEDIA_ACCESS_KEY: ${MINIO_ROOT_USER:-pictogram}
      PICTOGRAM_MEDIA_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-pictogram}
      PICTOGRAM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      # Ordering only — nothing is externalised or consumed yet (#196 / #197), so app does not
      # need a healthy broker to serve. The consumer ticket tightens this to service_healthy.
      kafka:
        condition: service_started

  chat:
    build:
      context: ./chat
    environment:
      # The public half of `app`'s PICTOGRAM_AUTH_SIGNING_KEY above (same x/y, no "d") —
      # chat verifies signatures but holds no signing material (ADR-0014, #164). A real
      # deployment derives this from its own PICTOGRAM_AUTH_SIGNING_KEY and never inherits
      # this default.
      PICTOGRAM_AUTH_PUBLIC_KEY: ${PICTOGRAM_AUTH_PUBLIC_KEY:-{"kty":"EC","crv":"P-256","kid":"pictogram-compose-dev","x":"7EWxh26yV1MJB79bw4ltkPt9iBmiewFFvBwG-DDMOTE","y":"jfek6RiC-fb6vxojc9T4n-QdAjwhHYoMychxZ3gSa5g"}}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # The single published entrypoint (ADR-0012, ADR-0014, #169): fronts both `app` and
  # `chat` on one origin, routed by path in the Caddyfile.
  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${PICTOGRAM_PORT:-8080}:8080"
    healthcheck:
      # Hits `app` *through* the route, so a healthy `caddy` means the origin is
      # actually serving, not just that the process is up.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy
      chat:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  kafkadata:
