spring:
  application:
    name: chat

# Verifies Pictogram access tokens at the WebSocket handshake (ADR-0014, #164). The public
# JWK is identity's signing key with its private "d" stripped — chat holds no signing
# material, only what it needs to check a signature.
pictogram:
  auth:
    public-key: ${PICTOGRAM_AUTH_PUBLIC_KEY:}

server:
  port: 8081

# `health` is the Boot default (#163). `prometheus` is added for Grafana Alloy to scrape
# (ADR-0016) — no Caddy route is added for it, so it stays reachable only on the compose
# network.
management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health, prometheus
