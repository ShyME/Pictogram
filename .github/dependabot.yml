# Weekly dependency scans. Non-major bumps are grouped into one PR per
# ecosystem; majors open individual PRs (groups only match minor/patch).
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # buildSrc is a separate Gradle build with its own build.gradle.kts (plugin
  # deps); it is not covered by the "/backend" scan.
  - package-ecosystem: "gradle"
    directories:
      - "/backend"
      - "/backend/buildSrc"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
    groups:
      gradle:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # chat is a separate Gradle build (ADR-0014) with its own version pins — Spring
  # Boot, Spotless, palantir-java-format are copied from backend/'s catalog, not
  # shared with it. This is the mechanism that surfaces drift: its bump PRs land
  # alongside backend's, so a reviewer can reconcile the pins consciously instead
  # of one silently lagging.
  - package-ecosystem: "gradle"
    directory: "/chat"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
    groups:
      gradle:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # "/" scans the repo-root action.yml and .github/workflows/*; it does not
  # recurse, so the composite actions under .github/actions/* are listed too.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Node 24 is the newest Active LTS; 26 goes LTS 2026-10-28. Hold the major
      # until then — minor/patch still flow.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"

  # chat/Dockerfile pins the same eclipse-temurin tags as backend/Dockerfile — its
  # own scan is what surfaces the two drifting apart (see the gradle entry above).
  - package-ecosystem: "docker"
    directory: "/chat"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The "docker" ecosystem only reads Dockerfiles; Compose files need the
  # dedicated "docker-compose" ecosystem. "/" picks up every compose*.yaml at
  # the repo root.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
    groups:
      docker-compose:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Upstream repo is archived; a replacement is tracked separately.
      - dependency-name: "minio/minio"
      # A Postgres major bump is its own ticket; minor/patch still flow.
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"
