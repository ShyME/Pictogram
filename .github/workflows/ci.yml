name: CI

# Every change reaches `main` through a PR, so the PR run is the gate: it runs the
# backend + frontend suites. The post-merge push to `main` runs *only* the blackbox
# job — with "Require branches to be up to date before merging" on, the merged tree is
# byte-identical to what the PR already tested, so re-running those suites is wasted work.
# `workflow_dispatch` forces a full run on demand.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede an in-flight PR run on a new push; never cancel a `main` run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # setup-gradle validates the wrapper by default, so no standalone
      # gradle/actions/wrapper-validation step is needed.
      - uses: gradle/actions/setup-gradle@v6

      # Testcontainers pulls postgres + minio cold on every fresh runner (~20-40s). Cache a
      # `docker save` of both, keyed on the SharedPostgres / SharedMinio sources that pin the
      # tags (bumping a pin invalidates the cache) plus an ISO week — `postgres:17-alpine` is a
      # moving tag, so the week suffix forces a weekly re-pull rather than freezing one patch
      # release until someone edits a pin.
      - name: Testcontainers image key
        id: tc-key
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Testcontainers images
        id: testcontainers-images
        uses: actions/cache@v6
        with:
          path: ~/testcontainers-images
          key: >-
            testcontainers-images-${{ hashFiles('backend/test-support/src/main/java/me/imshy/pictogram/testsupport/SharedPostgres.java',
            'backend/test-support/src/main/java/me/imshy/pictogram/testsupport/SharedMinio.java') }}-${{ steps.tc-key.outputs.week }}

      - name: Load cached Testcontainers images
        if: steps.testcontainers-images.outputs.cache-hit == 'true'
        run: |
          docker load -i ~/testcontainers-images/postgres.tar
          docker load -i ~/testcontainers-images/minio.tar

      - name: Pull and save Testcontainers images
        if: steps.testcontainers-images.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/testcontainers-images
          docker pull postgres:17-alpine
          docker pull minio/minio:RELEASE.2025-09-07T16-13-09Z
          docker save postgres:17-alpine -o ~/testcontainers-images/postgres.tar
          docker save minio/minio:RELEASE.2025-09-07T16-13-09Z -o ~/testcontainers-images/minio.tar

      # `check`, not `build`: nothing on the PR path consumes pictogram.jar (the Blackbox job
      # builds its own image), so `bootJar` is dead weight here. Runs Modulith verify(), the
      # unit + @ApplicationModuleTest + @Tag("fast") scenario suites, Spotless, and the
      # openapi.json drift check. SharedPostgres drops withReuse because CI is set.
      - name: Check
        working-directory: backend
        run: ./gradlew check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/**/build/reports/tests/
          retention-days: 7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend

      - name: Format check
        run: pnpm format:check

      - name: Lint (incl. slice boundaries)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  # The heavy suite: the whole app in containers, exercised black-box. Runs on the push to
  # `main` (and on demand) — never on PRs. Feature journeys land here with their tickets.
  blackbox:
    name: Blackbox
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      # compose.mock-oauth.yaml overlays mock-oauth2-server (as Google) so the signed-in
      # journeys can run; every `docker compose` step below picks up both files.
      COMPOSE_FILE: compose.yaml:compose.mock-oauth.yaml
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
      - uses: ./.github/actions/setup-frontend

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the app
        run: docker compose up --build -d --wait

      # @Tag("blackbox") backend tests: the ContainerDriver hits the running stack above.
      - name: Backend blackbox tests
        working-directory: backend
        run: ./gradlew build -PincludeBlackbox

      - name: Playwright journeys
        working-directory: frontend
        run: pnpm test:e2e
        env:
          PICTOGRAM_BASE_URL: http://localhost:8080

      - name: Dump app logs
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop the app
        if: always()
        run: docker compose down -v
