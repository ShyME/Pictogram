name: CI

# On-demand only — the "Run workflow" button in the Actions tab, never automatically on a
# PR or a push to `main` (GitHub Actions minutes budget). A manual run does the full sweep:
# the backend, chat and frontend suites plus the `blackbox` job. Local `./gradlew check` /
# `pnpm test` / `task test:blackbox` are the everyday gate; this workflow is the belt-and-braces
# run before a merge or a deploy (see the README "Continuous integration" section).
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # setup-gradle validates the wrapper by default, so no standalone
      # gradle/actions/wrapper-validation step is needed.
      - uses: gradle/actions/setup-gradle@v6

      # Testcontainers pulls postgres + minio cold on every fresh runner (~20-40s). Cache a
      # `docker save` of both, keyed on the SharedPostgres / SharedMinio sources that pin the
      # tags (bumping a pin invalidates the cache) plus an ISO week — `postgres:18-alpine` is a
      # moving tag, so the week suffix forces a weekly re-pull rather than freezing one patch
      # release until someone edits a pin.
      - name: Testcontainers image key
        id: tc-key
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Testcontainers images
        id: testcontainers-images
        uses: actions/cache@v6
        with:
          path: ~/testcontainers-images
          key: >-
            testcontainers-images-${{ hashFiles('backend/test-support/src/main/java/me/imshy/pictogram/testsupport/SharedPostgres.java',
            'backend/test-support/src/main/java/me/imshy/pictogram/testsupport/SharedMinio.java') }}-${{ steps.tc-key.outputs.week }}

      - name: Load cached Testcontainers images
        if: steps.testcontainers-images.outputs.cache-hit == 'true'
        run: |
          docker load -i ~/testcontainers-images/postgres.tar
          docker load -i ~/testcontainers-images/minio.tar

      - name: Pull and save Testcontainers images
        if: steps.testcontainers-images.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/testcontainers-images
          docker pull postgres:18-alpine
          docker pull minio/minio:RELEASE.2025-09-07T16-13-09Z
          docker save postgres:18-alpine -o ~/testcontainers-images/postgres.tar
          docker save minio/minio:RELEASE.2025-09-07T16-13-09Z -o ~/testcontainers-images/minio.tar

      # `check`, not `build`: nothing here consumes pictogram.jar (the Blackbox job
      # builds its own image), so `bootJar` is dead weight. Runs Modulith verify(), the
      # unit + @ApplicationModuleTest + @Tag("fast") scenario suites, Spotless, and the
      # openapi.json drift check. SharedPostgres drops withReuse because CI is set.
      - name: Check
        working-directory: backend
        run: ./gradlew check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/**/build/reports/tests/
          retention-days: 7

  # chat (ADR-0014) is its own Gradle build, independent of backend/ — no Testcontainers,
  # no shared cache key, its own job so a chat failure never masks a backend one or vice versa.
  chat:
    name: Chat build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check
        working-directory: chat
        run: ./gradlew check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chat-test-reports
          path: chat/build/reports/tests/
          retention-days: 7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend

      - name: Format check
        run: pnpm format:check

      - name: Lint (incl. slice boundaries)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  # Visual-regression suite (ADR-0013): Playwright `toHaveScreenshot` over the `/ui`
  # showcase and `/login`, at a narrow and a wide viewport, against a bare `vite` dev
  # server (no backend). Runs in the pinned Playwright image so font/AA rendering matches
  # the committed baselines in frontend/visual/__screenshots__/**/*-linux.png; `retries: 0`
  # holds. To refresh a baseline after an intentional UI change, regenerate it in this same
  # image (see CONTRIBUTING → Visual regression) or take it from the `visual-regression`
  # artifact this job uploads.
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: frontend
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Screenshot suite
        run: pnpm test:visual
      - name: Upload screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression
          path: |
            frontend/visual/__screenshots__/
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # The heavy suite: the whole app in containers, exercised black-box.
  blackbox:
    name: Blackbox
    runs-on: ubuntu-latest
    env:
      # compose.mock-oauth.yaml overlays mock-oauth2-server (as Google) so the signed-in
      # journeys can run; every `docker compose` step below picks up both files.
      COMPOSE_FILE: compose.yaml:compose.mock-oauth.yaml
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
      - uses: ./.github/actions/setup-frontend

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # ChatDockerImageTest builds chat/Dockerfile itself and runs it as a container —
      # independent of the compose stack below, so it can run before it comes up.
      - name: Chat Docker image test
        working-directory: chat
        run: ./gradlew test -PincludeBlackbox

      - name: Upload chat test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chat-blackbox-test-reports
          path: chat/build/reports/tests/
          retention-days: 7

      - name: Start the app
        run: docker compose up --build -d --wait

      # The shared Caddy origin (#169) serves `app`, and routes /ws to `chat` — a plain
      # GET gets 401 from chat's handshake filter, where `app` would 200 the SPA
      # fallback. The backend blackbox ChatConnectionTests then does the real handshake.
      - name: Verify the shared origin fronts both app and chat
        run: |
          curl -sf -o /dev/null http://localhost:8080/actuator/health
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ws)
          [ "$code" = 401 ] || { echo "chat /ws route returned $code, expected 401"; exit 1; }

      # @Tag("blackbox") backend tests: the ContainerDriver hits the running stack above.
      - name: Backend blackbox tests
        working-directory: backend
        run: ./gradlew build -PincludeBlackbox

      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: blackbox-test-reports
          path: |
            backend/**/build/reports/tests/
            backend/**/build/test-results/
          retention-days: 7

      - name: Playwright journeys
        working-directory: frontend
        run: pnpm test:e2e
        env:
          PICTOGRAM_BASE_URL: http://localhost:8080

      - name: Dump app logs
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop the app
        if: always()
        run: docker compose down -v
