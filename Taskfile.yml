# Common tasks. Install go-task: https://taskfile.dev  (brew install go-task)
# `task --list` shows everything.
version: '3'

dotenv: ['.env']

tasks:
  default:
    cmds:
      - task --list
    silent: true

  up:
    desc: Build and run the whole app in containers at http://localhost:8080 (mock Google — sign in with any username)
    env:
      COMPOSE_FILE: compose.yaml:compose.mock-oauth.yaml
    cmds:
      - docker compose up --build -d --wait
      - 'echo "Pictogram: http://localhost:{{.PICTOGRAM_PORT | default 8080}}"'
      - 'echo "Demo data: task seed  (then sign in as ''alice'')"'

  up:google:
    desc: Like `up`, but against real Google — needs GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET in .env
    env:
      COMPOSE_FILE: compose.yaml:compose.google.yaml
    cmds:
      - docker compose up --build -d --wait
      - 'echo "Pictogram: http://localhost:{{.PICTOGRAM_PORT | default 8080}}"'

  seed:
    desc: Populate a running `task up` stack with a fixed demo graph — then sign in as 'alice'
    cmds:
      - node scripts/seed.mjs

  down:
    desc: Stop the whole-app stack — either variant (keeps volumes)
    cmds:
      - docker compose -f compose.yaml down --remove-orphans

  logs:
    desc: Tail the app container logs
    cmds:
      - docker compose -f compose.yaml logs -f app

  dev:
    desc: Start dev infra only (Postgres + MinIO + mock-oauth2-server)
    cmds:
      - docker compose -f compose.dev.yaml up -d

  dev:down:
    desc: Stop the dev infra
    cmds:
      - docker compose -f compose.dev.yaml down

  backend:
    desc: Run the backend on the host (local profile; auto-starts dev infra)
    dir: backend
    cmds:
      - ./gradlew :app:bootRun

  chat:
    desc: Run chat on the host (its own Gradle build — ADR-0014)
    dir: chat
    cmds:
      - ./gradlew bootRun

  frontend:
    desc: Run the Vite dev server (proxies /api and /oauth2 to the host backend)
    dir: frontend
    cmds:
      - pnpm install
      - pnpm dev

  format:
    desc: Auto-format the codebase — backend (Spotless + ktfmt), chat, and frontend (Prettier)
    cmds:
      - task: format:backend
      - task: format:chat
      - task: format:frontend

  format:backend:
    dir: backend
    cmds:
      - ./gradlew spotlessApply

  format:chat:
    dir: chat
    cmds:
      - ./gradlew spotlessApply

  format:frontend:
    dir: frontend
    cmds:
      - pnpm install
      - pnpm format

  test:
    desc: Run all checks — backend build, chat build, frontend lint/typecheck/tests, scripts
    cmds:
      - task: test:backend
      - task: test:chat
      - task: test:frontend
      - task: test:scripts

  test:scripts:
    desc: Unit-test the zero-dependency repo scripts (Node's built-in test runner)
    cmds:
      - node --test "scripts/*.test.mjs"

  test:backend:
    dir: backend
    cmds:
      - ./gradlew build

  test:chat:
    dir: chat
    cmds:
      - ./gradlew check

  test:frontend:
    dir: frontend
    cmds:
      - pnpm install
      - pnpm format:check
      - pnpm lint
      - pnpm typecheck
      - pnpm test

  test:e2e:
    desc: Playwright blackbox journeys — builds and starts the full stack (app + mock OIDC), runs, tears down
    dir: frontend
    env:
      COMPOSE_FILE: ../compose.yaml:../compose.mock-oauth.yaml
    cmds:
      - pnpm install
      - pnpm exec playwright install --with-deps chromium
      - docker compose up --build -d --wait
      - defer: docker compose down -v
      - pnpm test:e2e

  test:blackbox:
    desc: The full main-only tier — backend + chat @Tag("blackbox") scenarios + Playwright journeys against the built image
    env:
      COMPOSE_FILE: compose.yaml:compose.mock-oauth.yaml
    cmds:
      - cd chat && ./gradlew test -PincludeBlackbox
      - docker compose up --build -d --wait
      - defer: docker compose down -v
      - curl --fail http://localhost:{{.PICTOGRAM_CHAT_PORT | default 8082}}/actuator/health
      - cd backend && ./gradlew build -PincludeBlackbox
      - cd frontend && pnpm install && pnpm exec playwright install --with-deps chromium && pnpm test:e2e

  openapi:
    desc: Regenerate backend/openapi.json and the frontend's typed client from it
    cmds:
      - cd backend && ./gradlew :app:generateOpenApiSpec
      - cd frontend && pnpm install && pnpm generate:api

  clean:
    desc: Stop everything and drop volumes and build output
    cmds:
      - docker compose -f compose.yaml down -v --remove-orphans
      - docker compose -f compose.dev.yaml down -v
      - cd backend && ./gradlew clean
      - cd chat && ./gradlew clean
      - rm -rf frontend/dist
