# Infra only — the backend and frontend run on the host (see application-local.yml).
# Started automatically by spring-boot-docker-compose when the app runs with -Dspring.profiles.active=local.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pictogram
      POSTGRES_USER: pictogram
      POSTGRES_PASSWORD: pictogram
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pictogram"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pictogram
      MINIO_ROOT_PASSWORD: pictogram
    ports:
      - "9000:9000"
      - "9001:9001"

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
