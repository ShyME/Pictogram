# Infra only — the backend and frontend run on the host (see application-local.yml and
# the frontend Vite proxy). Started automatically by spring-boot-docker-compose when the
# app runs on the "local" profile; or by hand with `docker compose -f compose.dev.yaml up`.
#
# Credentials are fixed here to match application-local.yml — the host JVM doesn't read
# .env, so parameterising them would only drift. .env drives compose.yaml (the container run).
name: pictogram-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pictogram
      POSTGRES_USER: pictogram
      POSTGRES_PASSWORD: pictogram
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 moved PGDATA to /var/lib/postgresql/18/docker and the image VOLUME up to
      # /var/lib/postgresql — mounting the old /data path leaves the cluster off the volume.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pictogram -d pictogram"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pictogram
      MINIO_ROOT_PASSWORD: pictogram
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090

  # Fixes the named volume's ownership for the non-root broker — see compose.yaml.
  # spring-boot-docker-compose ignores it (it exits immediately, it is not a service to wait on).
  kafka-init:
    image: &kafka-image apache/kafka-native:4.2.1
    user: "0:0"
    entrypoint: ["sh", "-c", "mkdir -p /var/lib/kafka/data && chown -R 1000:1000 /var/lib/kafka/data"]
    labels:
      org.springframework.boot.ignore: "true"
    volumes:
      - kafkadata:/var/lib/kafka/data

  # KRaft broker for the one externalised flow (ADR-0015) — advertised on localhost so the
  # host JVM reaches it. spring-boot-docker-compose picks it up on the "local" profile.
  kafka:
    image: *kafka-image
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # KAFKA_OPTS, not KAFKA_HEAP_OPTS — the native launch script only forwards the former.
      KAFKA_OPTS: -Xmx512m -Xms256m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/9092' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  pgdata:
  miniodata:
  kafkadata:
