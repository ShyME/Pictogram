# Infra only — the backend and frontend run on the host (see application-local.yml and
# the frontend Vite proxy). Started automatically by spring-boot-docker-compose when the
# app runs on the "local" profile; or by hand with `docker compose -f compose.dev.yaml up`.
#
# Credentials are fixed here to match application-local.yml — the host JVM doesn't read
# .env, so parameterising them would only drift. .env drives compose.yaml (the container run).
name: pictogram-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pictogram
      POSTGRES_USER: pictogram
      POSTGRES_PASSWORD: pictogram
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 moved PGDATA to /var/lib/postgresql/18/docker and the image VOLUME up to
      # /var/lib/postgresql — mounting the old /data path leaves the cluster off the volume.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pictogram -d pictogram"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pictogram
      MINIO_ROOT_PASSWORD: pictogram
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090

volumes:
  pgdata:
  miniodata:
